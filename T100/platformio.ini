[platformio]
src_dir = .
data_dir = data

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    Links2004/WebSockets
    https://github.com/acrobotic/Ai_Ardulib_SSD1306.git

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    Links2004/WebSockets
    https://github.com/acrobotic/Ai_Ardulib_SSD1306.git