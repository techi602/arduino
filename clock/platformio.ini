[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_extra_dirs = $PROJECT_PACKAGES_DIR/framework-arduino-avr/libraries
build_flags = -I$PROJECT_PACKAGES_DIR/framework-arduino-avr/libraries/SPI/src
lib_deps =
    SPI
    adafruit/RTClib
    adafruit/Adafruit BMP085 Library
    https://github.com/johnrickman/LiquidCrystal_I2C.git